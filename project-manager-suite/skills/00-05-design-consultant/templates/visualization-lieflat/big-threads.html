<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>数据流向 · 来源、处理与去向</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../tokens.css" data-design-consultant-tokens>
<script src="lieflat-theme.js" data-design-consultant-theme></script>
<style>
  :root{--bg:var(--viz-editorial-c-f0efeb);--dark:var(--viz-editorial-c-1c1c1a);--paper:var(--viz-editorial-c-f0efeb)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);font-family:var(--font-sans);padding:40px;-webkit-font-smoothing:antialiased;
    display:flex;justify-content:center}
  .card{background:var(--dark);color:var(--paper);border-radius:24px;padding:34px 34px 24px;
    width:min(1200px,100%)}
  h2{font-weight:700;font-size:19px;letter-spacing:-.02em;margin-bottom:4px}
  .sub{font-size:12px;color:var(--viz-editorial-c-8f8e88);margin-bottom:6px}
  .src{font-size:9.5px;color:var(--viz-editorial-c-55554f);margin-top:12px;letter-spacing:.08em;font-weight:500}
  #ch{width:100%;height:74vh;min-height:560px;display:block}
  #status{height:34px;display:flex;align-items:center;gap:10px;
    font-size:12px;color:var(--viz-editorial-c-8f8e88);border-top:1px solid var(--viz-editorial-c-2e2d29);margin-top:6px;padding-top:8px}
  #status b{color:var(--paper);font-weight:700}
  #status .pin{font-size:9px;letter-spacing:.1em;color:var(--viz-editorial-c-55554f);font-weight:700}
  svg text{font-family:var(--font-sans);user-select:none}

  /* thread states */
  .thread{transition:opacity .18s ease,stroke-width .18s ease}
  .thread.hot{opacity:.95 !important}
  svg.focused .thread:not(.hot){opacity:.035 !important}
  .nodelab{cursor:pointer;transition:opacity .18s ease}
  svg.focused .nodelab:not(.hot){opacity:.25}
  .hit{cursor:pointer}
</style>
<style data-design-consultant-lieflat>
  html{background:var(--bg) !important}
  body{background:var(--bg) !important;color:var(--text) !important;font-family:var(--font-sans) !important}
  h1,h2,h3,.pagehead h1{font-family:var(--font-display) !important;letter-spacing:0 !important}
  svg text{font-family:var(--font-sans) !important}
  .sub,.src{color:var(--text-muted) !important}
  .card{border-radius:var(--radius-lg) !important;background:var(--bg) !important;color:var(--text) !important}
  .card.dark{background:var(--surface-inverse) !important;color:var(--text-inverse) !important}
  .card.dark .sub,.card.dark .src{color:color-mix(in srgb,var(--text-inverse) 62%,transparent) !important}
  .badge{border-radius:var(--radius-xs) !important}
  html[data-embedded="true"] .pagehead{display:none !important}
  .hit:focus{outline:none !important;stroke:var(--primary) !important;stroke-width:2 !important;stroke-opacity:1 !important}
  button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--primary) !important;outline-offset:2px !important}
  @media (max-width:900px){
    body{padding:20px !important}
    .grid2{grid-template-columns:minmax(0,1fr) !important;gap:18px !important;width:100% !important;min-width:0 !important}
    .card.wide{grid-column:auto !important}
    .card{padding:24px 20px 18px !important;min-width:0 !important;overflow-x:auto !important;overscroll-behavior-inline:contain;touch-action:pan-x pan-y pinch-zoom}
    .split{grid-template-columns:minmax(0,1fr) !important;gap:18px !important;min-width:0 !important}
    .card>svg{width:720px !important;max-width:none !important}
    .ch,.wrap{width:720px !important;max-width:none !important;height:420px !important}
    #ch{width:1140px !important;max-width:none !important;height:640px !important;min-height:640px !important}
    canvas{max-width:none !important}
    .pagehead{margin-bottom:18px !important}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-delay:0ms !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<div class="card">
  <h2>数据从哪里来，又流向哪里</h2>
  <div class="sub">来源 → 处理环节 → 去向；悬停追踪单条路径或整组关联，单击固定，单击空白处释放</div>
  <svg id="ch" viewBox="0 0 1140 640" preserveAspectRatio="xMidYMid meet"></svg>
  <div id="status"><span id="stext">将指针移到连线或名称上</span><span class="pin" id="spin"></span></div>
  <div class="src">数据流向 · 可交互 · 链路地图</div>
</div>
<script>
window.DC_LIEFLAT_THEME.installAdapters();const C=window.DC_LIEFLAT_COLORS;const FONT_FAMILY=getComputedStyle(document.documentElement).getPropertyValue("--font-sans").trim()||"sans-serif";const ACCENT=window.DC_LIEFLAT_THEME.accent;const ACCENT_ON_DARK=window.DC_LIEFLAT_THEME.accentOnDark;const formatWan=(value,unit="")=>{const amount=Number(value)/10;const text=Number.isInteger(amount)?String(amount):amount.toFixed(1);return text+"万"+unit;};
const PAPER=C["F0EFEB"],NS='http://www.w3.org/2000/svg';
const el=(p,t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);p.appendChild(n);return n};
const txt=(p,a,s)=>{const n=el(p,'text',a);n.textContent=s;return n};
const rnd=(i,k)=>Math.abs(((i*73856093)^(k*19349663))%1000)/1000;

// ── the pipeline ──
const SRC=['网页端','iOS 端','安卓端','桌面端','命令行','公共 API','回调','表单','邮件接入','会话组件',
  '计费事件','鉴权事件','搜索日志','审计事件','崩溃报告','性能上报','CDN 日志','边缘日志','任务事件','同步事件',
  '数据导入','导出请求','管理后台','合作方 API','IoT 心跳','数据回填'];
const MIDV=['解析','校验','去重','补充','地理解析','会话化','隐私脱敏','评分','采样','路由',
  '批处理','窗口','关联','展平','过滤','哈希','加密','压缩','建索引','标记'];
const MID=MIDV.flatMap(v=>[v+' A',v+' B']);          // 40 processors
const DST=['数据仓库','数据分析','CRM','广告平台','计费系统','站内搜索','模型管道','冷归档','审计平台','数据导出'];

// routes: each source emits 2-3 full paths; volume is long-tailed
const routes=[];
SRC.forEach((s,i)=>{
  const n=2+Math.floor(rnd(i+1,5)*2);
  for(let k=0;k<n;k++){
    const mi=Math.floor(rnd(i*3+k+2,13)*MID.length);
    const di=Math.min(9,Math.floor(rnd(i*5+k+4,19)**2*11));   // skew: low dsts hoard
    const v=Math.round(1+rnd(i*7+k+6,29)**2*30);              // 1..31, long tail
    routes.push({s:i,m:mi,d:di,v});
  }
});

// ── geometry ──
const X1=180,X2=560,X3=930;
const sy=i=>36+i*22.6, my=i=>30+i*14.6, dy=i=>60+i*57;
const path=r=>`M${X1+6} ${sy(r.s)} C${(X1+X2)/2} ${sy(r.s)} ${(X1+X2)/2} ${my(r.m)} ${X2} ${my(r.m)}`
  +` C${(X2+X3)/2} ${my(r.m)} ${(X2+X3)/2} ${dy(r.d)} ${X3-6} ${dy(r.d)}`;

const svg=document.getElementById('ch');
const stext=document.getElementById('stext'),spin=document.getElementById('spin');
const fmt=v=>formatWan(v,'条事件/日');
let pinned=null;

// column headers
[[X1,'① 数据来源'],[X2,'② 处理环节'],[X3,'③ 数据去向']].forEach(([x,t])=>
  txt(svg,{x,y:14,'font-size':9,'font-weight':800,fill:PAPER,'letter-spacing':'.14em','text-anchor':'middle'},t));

// threads (drawn first, under labels)
const gThreads=el(svg,'g',{});
routes.forEach((r,ri)=>{
  r.el=el(gThreads,'path',{d:path(r),fill:'none',stroke:PAPER,
    'stroke-width':Math.max(.6,r.v*.14),class:'thread',
    opacity:.06+Math.min(.2,r.v*.012),'stroke-linecap':'round'});
  // invisible fat twin: the hover/click target
  r.hit=el(gThreads,'path',{d:path(r),fill:'none',stroke:C["1C1C1A"],'stroke-opacity':0,
    'stroke-width':9,class:'hit'});
  r.hit.dataset.route=ri;
});

// node labels + ticks; each carries hit metadata
const mkNode=(x,y,label,anchor,cls,meta,size,fill)=>{
  const g=el(svg,'g',{class:'nodelab'});
  g.dataset.kind=meta.kind;g.dataset.idx=meta.idx;
  el(g,'rect',{x:x-3,y:y-1.6,width:6,height:3.2,fill:PAPER,opacity:.85});
  txt(g,{x:anchor==='end'?x-9:x+9,y:y+2.6,'font-size':size,'font-weight':600,
    fill,'text-anchor':anchor},label);
  // generous invisible hit zone
  el(g,'rect',{x:anchor==='end'?x-92:x-6,y:y-6.5,width:98,height:13,fill:C["1C1C1A"],'fill-opacity':0,class:'hit'});
  return g;
};
SRC.forEach((s,i)=>mkNode(X1,sy(i),s,'end','',{kind:'s',idx:i},7.5,C["B3B0A4"]));
MID.forEach((m,i)=>mkNode(X2,my(i),m,'start','',{kind:'m',idx:i},5.4,C["6A6963"]));
DST.forEach((d,i)=>{
  const g=el(svg,'g',{class:'nodelab'});
  g.dataset.kind='d';g.dataset.idx=i;
  el(g,'circle',{cx:X3,cy:dy(i),r:3.4,fill:PAPER});
  txt(g,{x:X3+12,y:dy(i)+3,'font-size':8.5,'font-weight':700,fill:C["B3B0A4"],'letter-spacing':'.08em'},d);
  el(g,'rect',{x:X3-8,y:dy(i)-10,width:120,height:20,fill:C["1C1C1A"],'fill-opacity':0,class:'hit'});
});

// ── highlight machinery ──
const nodeLabs=[...svg.querySelectorAll('.nodelab')];
const clear=()=>{
  svg.classList.remove('focused');
  routes.forEach(r=>r.el.classList.remove('hot'));
  nodeLabs.forEach(n=>n.classList.remove('hot'));
  stext.textContent='将指针移到连线或名称上';spin.textContent='';
};
const focusRoutes=(rs,label)=>{
  svg.classList.add('focused');
  routes.forEach(r=>r.el.classList.toggle('hot',rs.includes(r)));
  nodeLabs.forEach(n=>{
    const k=n.dataset.kind,ix=+n.dataset.idx;
    n.classList.toggle('hot',rs.some(r=>(k==='s'&&r.s===ix)||(k==='m'&&r.m===ix)||(k==='d'&&r.d===ix)));
  });
  stext.innerHTML=label;
};
const routeLabel=r=>`<b>${SRC[r.s]}</b> → ${MID[r.m]} → <b>${DST[r.d]}</b> · ${fmt(r.v)}`;
const nodeSel=(kind,idx)=>{
  const rs=routes.filter(r=>(kind==='s'&&r.s===idx)||(kind==='m'&&r.m===idx)||(kind==='d'&&r.d===idx));
  const total=rs.reduce((a,r)=>a+r.v,0);
  const name=kind==='s'?SRC[idx]:kind==='m'?MID[idx]:DST[idx];
  return [rs,`<b>${name}</b> · ${rs.length} 条路径 · 合计 ${fmt(total)}`];
};

const apply=t=>{
  const hit=t.closest?.('.hit');
  if(!hit)return null;
  const rg=hit.dataset.route,ng=hit.closest('.nodelab');
  if(rg!=null){const r=routes[+rg];return()=>focusRoutes([r],routeLabel(r))}
  if(ng){const [rs,lab]=nodeSel(ng.dataset.kind,+ng.dataset.idx);return()=>focusRoutes(rs,lab)}
  return null;
};
svg.addEventListener('mousemove',e=>{
  if(pinned)return;
  const f=apply(e.target);
  f?f():clear();
});
svg.addEventListener('mouseleave',()=>{if(!pinned)clear()});
svg.addEventListener('click',e=>{
  const f=apply(e.target);
  if(f){pinned=f;f();spin.textContent='已固定 · 单击空白处释放'}
  else{pinned=null;clear()}
});

</script>
<script data-design-consultant-keyboard>
(function enhanceThreadsKeyboardAccess() {
  const chart = document.getElementById("ch");
  const status = document.getElementById("status");
  const targets = [...chart.querySelectorAll(".hit")];
  chart.setAttribute("role", "group");
  chart.setAttribute("aria-label", "数据流向关系图。使用 Tab 浏览路径或节点，Enter 或空格固定，Escape 释放。");
  status.setAttribute("role", "status");
  status.setAttribute("aria-live", "polite");

  function labelFor(target) {
    if (target.dataset.route != null) {
      const route = routes[Number(target.dataset.route)];
      return SRC[route.s] + " 到 " + DST[route.d] + "，经 " + MID[route.m] + "，" + fmt(route.v);
    }
    const node = target.closest(".nodelab");
    const kind = node.dataset.kind;
    const index = Number(node.dataset.idx);
    const [selected] = nodeSel(kind, index);
    const name = kind === "s" ? SRC[index] : kind === "m" ? MID[index] : DST[index];
    const total = selected.reduce((sum, route) => sum + route.v, 0);
    return name + "，" + selected.length + " 条路径，" + fmt(total);
  }

  function release() {
    pinned = null;
    clear();
    spin.textContent = "";
    targets.forEach((target) => target.setAttribute("aria-pressed", "false"));
  }

  function pin(target) {
    const focus = apply(target);
    if (!focus) return;
    pinned = focus;
    focus();
    spin.textContent = "已固定 · 按 Escape 或单击空白处释放";
    targets.forEach((item) => item.setAttribute("aria-pressed", String(item === target)));
  }

  targets.forEach((target) => {
    target.setAttribute("tabindex", "0");
    target.setAttribute("role", "button");
    target.setAttribute("aria-label", labelFor(target));
    target.setAttribute("aria-pressed", "false");
    target.addEventListener("focus", () => {
      if (!pinned) apply(target)?.();
    });
    target.addEventListener("blur", () => {
      if (!pinned) clear();
    });
    target.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        pin(target);
      }
      if (event.key === "Escape") {
        event.preventDefault();
        release();
      }
    });
  });

  chart.addEventListener("keydown", (event) => {
    if (event.key === "Escape") release();
  });
  chart.addEventListener("click", (event) => {
    if (!apply(event.target)) release();
  });
})();
</script>
</body>
</html>
